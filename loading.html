<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binder Tracker lädt</title>
<style>
/* Ladeseite, wird von start.py gezeigt, solange Daten heruntergeladen werden. */
:root {
  --bg: #f3f1ec; --panel: rgba(255,255,255,.82); --ink: #1d1f24; --muted: #6b6f78;
  --track: #e2ded5; --accent: #d6322f; --err: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #15171b; --panel: rgba(31,34,40,.82); --ink: #eceef2; --muted: #9aa0ab; --track: #33373f; --accent: #ff5a52; --err: #ff8a80; }
}
:root[data-theme="dark"] { --bg: #15171b; --panel: rgba(31,34,40,.82); --ink: #eceef2; --muted: #9aa0ab; --track: #33373f; --accent: #ff5a52; --err: #ff8a80; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--accent) 12%, var(--bg)), var(--bg) 70%);
  color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden; display: grid; place-items: center; padding: 16px;
}

/* ---------- Drehende Karten im Hintergrund ---------- */
.deck { position: fixed; inset: 0; perspective: 900px; pointer-events: none; }
.card {
  position: absolute; width: var(--w); aspect-ratio: 63 / 88;
  left: var(--x); top: var(--y); transform-style: preserve-3d;
  animation: spin var(--t) linear infinite, float calc(var(--t) * 1.3) ease-in-out infinite alternate;
  animation-delay: var(--d);
  opacity: .55; filter: drop-shadow(0 10px 18px rgba(0,0,0,.25));
}
.card > * {
  position: absolute; inset: 0; border-radius: 6%; backface-visibility: hidden; overflow: hidden;
}
.card img { width: 100%; height: 100%; object-fit: cover; }
.card .back {
  transform: rotateY(180deg);
  background:
    radial-gradient(circle at 50% 50%, #fff 0 9%, #222 9% 12%, transparent 12%),
    linear-gradient(#d6322f 0 47%, #222 47% 53%, #f2f2f2 53%);
  border: 5px solid #2b5fb4;
}
.card .front:empty { background: linear-gradient(135deg, #f7d26b, #e0559a 55%, #4f9fe0); border: 5px solid #f1c232; }
@keyframes spin { from { transform: rotateY(0) rotateZ(var(--r)); } to { transform: rotateY(360deg) rotateZ(var(--r)); } }
@keyframes float { from { translate: 0 -12px; } to { translate: 0 12px; } }
@media (prefers-reduced-motion: reduce) { .card { animation: none; transform: rotateY(25deg) rotateZ(var(--r)); } }

/* ---------- Fortschritt ---------- */
.panel {
  position: relative; width: min(360px, 100%); padding: 28px 24px 24px; text-align: center;
  background: var(--panel); border-radius: 22px; backdrop-filter: blur(10px);
  box-shadow: 0 10px 40px rgba(0,0,0,.18);
}
h1 { margin: 0 0 18px; font-size: 20px; }
.ring { position: relative; width: 180px; height: 180px; margin: 0 auto 16px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 12; }
.ring .track { stroke: var(--track); }
.ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
.ring.failed .bar { stroke: var(--err); stroke-dashoffset: 0 !important; }
.ring.failed .pct { color: var(--err); }
.ring.busy svg { animation: turn 1.2s linear infinite; }
@keyframes turn { to { transform: rotate(270deg); } }
.pct { position: absolute; inset: 0; display: grid; place-content: center; font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pct small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
.label { font-weight: 600; }
.detail { color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.4em; }
.error { margin-top: 14px; padding: 12px; border-radius: 12px; color: var(--err); background: color-mix(in srgb, var(--err) 12%, transparent); text-align: left; }
.error[hidden] { display: none; }
body.done .panel { transition: opacity .4s, transform .4s; opacity: 0; transform: scale(.96); }
</style>
</head>
<body>
<div class="deck" id="deck" aria-hidden="true"></div>

<main class="panel" role="status" aria-live="polite">
  <h1>Binder Tracker wird vorbereitet</h1>
  <div class="ring busy" id="ring">
    <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="bar" id="bar" cx="60" cy="60" r="52"/></svg>
    <div class="pct"><span id="pct">…</span><small id="step"></small></div>
  </div>
  <div class="label" id="label">Verbinde mit dem Startskript…</div>
  <div class="detail" id="detail"></div>
  <div class="error" id="error" hidden></div>
</main>

<script>
const $ = id => document.getElementById(id);
const CIRC = 2 * Math.PI * 52;
const bar = $("bar");
bar.style.strokeDasharray = CIRC;
const fmt = n => n.toLocaleString("de-DE");

// Karten verteilt über den Bildschirm, mit unterschiedlicher Größe und Drehzeit.
function buildDeck(images) {
  const deck = $("deck");
  const n = Math.max(15, images.length);
  deck.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const card = document.createElement("div");
    card.className = "card";
    const w = 90 + Math.random() * 70;
    card.style.cssText = `--w:${w}px;--x:${(i % 5) * 20 + Math.random() * 12 - 4}%;--y:${Math.floor(i / 5) * 34 + Math.random() * 18 - 6}%;` +
      `--t:${6 + Math.random() * 6}s;--d:${-Math.random() * 10}s;--r:${Math.random() * 24 - 12}deg`;
    const front = document.createElement("div");
    front.className = "front";
    if (images.length) {
      const img = new Image();
      img.src = "/" + images[i % images.length];
      img.alt = "";
      img.onerror = () => img.remove();
      front.append(img);
    }
    const back = document.createElement("div");
    back.className = "back";
    card.append(front, back);
    deck.append(card);
  }
}

let deckKey = null;
let lastError = "";

function show(s) {
  const key = s.cards.join();
  if (key !== deckKey) { deckKey = key; buildDeck(s.cards); }

  const known = s.total > 0;
  const frac = known ? s.done / s.total : 0;
  $("ring").classList.toggle("busy", !known && !s.ready);
  bar.style.strokeDashoffset = s.ready ? 0 : known ? CIRC * (1 - frac) : CIRC * 0.75;
  $("pct").textContent = s.ready ? "100 %" : known ? Math.floor(frac * 100) + " %" : "…";
  $("step").textContent = s.steps > 1 && !s.ready ? `Schritt ${s.step} von ${s.steps}` : "";
  $("label").textContent = s.ready ? "Fertig!" : s.label || "Prüfe Daten…";
  $("detail").textContent = known && !s.ready ? `${s.phase} ${fmt(s.done)} / ${fmt(s.total)}` : "";

  if (s.error) {
    lastError = s.error;
    $("error").hidden = false;
    $("error").textContent = `Fehler: ${s.error} Bitte Internetverbindung prüfen und start.bat neu starten.`;
    $("ring").classList.remove("busy");
    $("ring").classList.add("failed");
    $("pct").textContent = "!";
    $("detail").textContent = "";
    return false;
  }
  if (s.ready) {
    document.body.classList.add("done");
    setTimeout(() => location.replace("/"), 600);
    return false;
  }
  return true;
}

async function poll() {
  try {
    const s = await (await fetch("/status", { cache: "no-store" })).json();
    if (show(s)) setTimeout(poll, 500);
  } catch {
    if (!lastError) {
      $("error").hidden = false;
      $("error").textContent = "Keine Verbindung zum Startskript. Läuft start.bat noch?";
    }
  }
}
poll();
</script>
</body>
</html>
